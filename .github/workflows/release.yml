# Stages a release on npm when a `v*` tag is pushed; the maintainer then approves it on npmjs.com
# (Staged Packages) with 2FA, so nothing goes live from CI alone. Provenance ("Built and signed on
# GitHub Actions") is signed here: only a CI run of a public repository can produce it.
#
# Authentication: npm cannot set up trusted publishing for a package that does not exist yet, so
# the first release uses a granular token in the NPM_TOKEN secret (stage-only, no 2FA bypass,
# shortest expiry). Once the package exists, trusted publishing (stage only) replaces it and the
# token and the secret are deleted; an empty NODE_AUTH_TOKEN then leaves npm to OIDC.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # signs the provenance statement, and authenticates trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # browsers and their system libraries preinstalled, see ci.yml; the image's Node 24 runs npm
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global bun
      # no `node-version`: only writes the registry auth for the image's own Node
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      # The tag is the trigger, not the version: npm publishes whatever package.json says. Refuse
      # a mismatch instead of staging a number nobody meant.
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      # The tag may point at a commit CI never ran on, and prepublishOnly (lint, check, unit tests)
      # has no e2e.
      - run: bun run test:e2e
      # staged, not published: the release goes live only after the maintainer approves it
      - run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # first release only, see the top of this file
