name: Bug report
description: Something in svelte-dialect doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal repository or StackBlitz link, or the smallest code that shows the problem (including the message JSON).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: svelte-dialect, svelte, @sveltejs/kit (if used), Node or browser
      placeholder: svelte-dialect 0.1.0, svelte 5.57.2, @sveltejs/kit 3.1.0, Node 22.17
    validations:
      required: true
